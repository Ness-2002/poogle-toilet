<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有所味 Poogle｜主頁</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat Version for Realtime Database & Auth & Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>
        :root {
            --poogle-cream: #FCF6E8;
            --poogle-yellow: #FFF57E;
            --poogle-blue: #72D0FF;
            --poogle-pink: #FF85D0;
            --poogle-gray: #D6D6D6;
            --poogle-ink: #1E2270;
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--poogle-cream);
            color: #18181B;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .poogle-pill-btn {
            border: 1.5px solid #18181B;
            transition: all 0.16s ease;
        }
        .poogle-pill-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 3px 0 #18181B;
        }
        .poogle-svg-btn {
            cursor: pointer;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        .poogle-svg-btn:focus, .poogle-svg-btn:focus-visible, .poogle-svg-btn:active {
            outline: none !important;
        }
        .poogle-bottle-hover {
            cursor: pointer;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        .poogle-bottle-hover:focus, .poogle-bottle-hover:focus-visible, .poogle-bottle-hover:active,
        svg:focus, g:focus {
            outline: none !important;
        }

        /* 1. 公廁地圖（粉紅門）：門板左移微開、露出右側深藍門框，門牌與門鎖同步左移 */
        #enterMapDoorBtn .door-leaf-anim,
        #enterMapDoorBtn .door-sign-anim,
        #enterMapDoorBtn .door-knob-anim {
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #enterMapDoorBtn:hover .door-leaf-anim {
            transform: translateX(-34px);
        }
        #enterMapDoorBtn:hover .door-sign-anim {
            transform: translateX(-18px);
        }
        #enterMapDoorBtn:hover .door-knob-anim {
            transform: translateX(-34px);
        }

        /* 2. 小怪圖鑑（黃色鏡面）：鏡面反光斜紋向右滑動 */
        #openMonsterDexBtn .mirror-glare-anim {
            transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #openMonsterDexBtn:hover .mirror-glare-anim {
            transform: translateX(135px);
        }

        /* 3. 個人空間（左下角洗手乳瓶）：頂部按壓頭往下按壓 */
        #openPersonalSpaceBtn .soap-pump-anim {
            transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        #openPersonalSpaceBtn:hover .soap-pump-anim {
            transform: translateY(24px);
        }

        /* 4. 公廁回報系統（綠色流動廁所門）：門板左移微開門縫、門牌與門把同步左移、指示燈變色 */
        #openReportSystemBtn .report-leaf-anim,
        #openReportSystemBtn .report-sign-anim,
        #openReportSystemBtn .report-handle-anim {
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #openReportSystemBtn .report-lock-anim {
            transition: fill 0.25s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #openReportSystemBtn:hover .report-leaf-anim {
            transform: translateX(-34px);
        }
        #openReportSystemBtn:hover .report-sign-anim {
            transform: translateX(-18px);
        }
        #openReportSystemBtn:hover .report-handle-anim {
            transform: translateX(-34px);
        }
        #openReportSystemBtn:hover .report-lock-anim {
            transform: translateX(-34px);
            fill: #5EE65A;
        }

        /* 左上角 Logo 柔和上下飄浮動畫（同評鑑頁氣味雲朵效果） */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .logo-float-anim {
            animation: floatLogo 2.8s ease-in-out infinite;
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden bg-[#FCF6E8] select-none relative flex items-center justify-center">

    <!-- Top-Left Logo (./img/logo.png) -->
    <div class="fixed top-[10%] left-[7.5%] z-30 pointer-events-auto">
        <img src="./img/logo.png" alt="有所味 Logo"
             class="logo-float-anim w-44 sm:w-60 md:w-72 lg:w-80 h-auto object-contain drop-shadow-sm"
             onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 320 115%22><text x=%2210%22 y=%2282%22 font-size=%2268%22 font-weight=%22900%22 fill=%22%2372D0FF%22 stroke=%22%231E2270%22 stroke-width=%224%22>有所味</text></svg>';" />
    </div>

    <!-- Top-Right Login Button -->
    <button id="homeLoginBtn" type="button" class="fixed top-[6.5%] right-[4.2%] z-30 flex items-center gap-3.5 group focus:outline-none">
        <span id="userAvatarCircle" class="w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-[#D6D6D6] group-hover:bg-[#72D0FF] border-2 border-transparent group-hover:border-[#1E2270] transition flex items-center justify-center text-base font-bold text-[#1E2270]"></span>
        <span id="userLoginText" class="text-base sm:text-xl font-medium text-black underline underline-offset-4 group-hover:text-[#1E2270]">登入</span>
    </button>

    <!-- Bottom-Left Bleeding Soap Bottle: 個人空間 (縮小為原本的 2/3) -->
    <div class="fixed bottom-0 left-0 z-30 pointer-events-none w-[154px] sm:w-[194px] md:w-[220px] aspect-square overflow-visible">
        <svg viewBox="0 0 360 360" class="w-full h-full overflow-visible focus:outline-none">
            <!-- Outer group handles the exact bottom-left bleeding position and tilt angle -->
            <g transform="translate(154, 206) rotate(28) translate(-150, -210)">
                <!-- Inner group handles hover animation cleanly without overriding SVG coordinates -->
                <g id="openPersonalSpaceBtn" class="poogle-bottle-hover pointer-events-auto focus:outline-none" role="button" aria-label="個人空間">
                    <title>點擊查看「個人空間」</title>
                    <!-- Stationary Invisible Hit Area for Pump Head (Prevents hover jitter when pump moves down) -->
                    <path d="M95,12 L288,12 L288,168 L95,168 Z" fill="transparent" stroke="none" />
                    <!-- Pump Dispenser Head & Spout (Presses down on hover) -->
                    <g class="soap-pump-anim">
                        <path d="M118,18 L194,18 C204,18 211,25 211,35 C211,45 204,52 194,52 L173,52 L173,80 L250,80 C261,80 268,88 271,100 L282,150 C284,158 277,165 268,165 C261,165 256,160 254,153 L246,108 L173,108 L173,136 L132,136 L132,52 L118,52 C108,52 101,45 101,35 C101,25 108,18 118,18 Z"
                              fill="#FCF6E8" stroke="#1E2270" stroke-width="2.8" stroke-linejoin="round" />
                    </g>
                    <!-- Bottle Neck Collar -->
                    <rect x="62" y="130" width="180" height="31" rx="8" fill="#FCF6E8" stroke="#1E2270" stroke-width="2.8" />
                    <!-- Blue Bottle Body (extended downward for full bottom-left bleed) -->
                    <rect x="25" y="156" width="252" height="290" rx="30" fill="#6FD2FF" stroke="#1E2270" stroke-width="2.8" />
                    <!-- Cream Label -->
                    <rect x="84" y="206" width="134" height="134" rx="14" fill="#FCF6E8" stroke="#1E2270" stroke-width="2.8" />
                    <text x="151" y="266" text-anchor="middle" fill="#111111" font-size="28" font-weight="500" letter-spacing="3">個人</text>
                    <text x="151" y="302" text-anchor="middle" fill="#111111" font-size="28" font-weight="500" letter-spacing="3">空間</text>
                </g>
            </g>
        </svg>
    </div>

    <!-- Full-Screen Responsive Vector Stage -->
    <main class="w-full h-full flex items-center justify-center overflow-hidden">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" class="w-full h-full max-w-full max-h-full">
            <defs>
                <clipPath id="pinkDoorFrameClip">
                    <rect x="766" y="112" width="312" height="478" rx="16" />
                </clipPath>
                <clipPath id="mirrorReflectionClip">
                    <rect x="516" y="620" width="560" height="335" rx="16" />
                </clipPath>
                <clipPath id="greenDoorFrameClip">
                    <path d="M1122,252 C1212,200 1626,200 1698,252 L1698,1010 Q1698,1024 1685,1024 L1136,1024 Q1122,1024 1122,1010 L1122,966 Q1122,958 1130,958 L1141,958 Q1150,958 1150,947 L1150,846 Q1150,835 1141,835 L1130,835 Q1122,835 1122,827 L1122,704 Q1122,696 1130,696 L1141,696 Q1150,696 1150,685 L1150,584 Q1150,573 1141,573 L1130,573 Q1122,573 1122,565 L1122,442 Q1122,434 1130,434 L1141,434 Q1150,434 1150,423 L1150,322 Q1150,311 1141,311 L1130,311 Q1122,311 1122,303 Z" />
                </clipPath>
            </defs>

            <!-- 1. PINK DOOR: 公廁地圖 (Links to ./map.html) -->
            <g id="enterMapDoorBtn" class="poogle-svg-btn" role="link" aria-label="進入公廁地圖">
                <title>點擊進入「公廁地圖」(map.html)</title>
                <!-- Dark Navy Door Frame Revealed Behind Pink Door When Hovered -->
                <rect x="766" y="112" width="312" height="478" rx="16" fill="#23297A" stroke="#1E2270" stroke-width="3" />
                <!-- Clipped Pink Door Panel that slides left on hover -->
                <g clip-path="url(#pinkDoorFrameClip)">
                    <g class="door-leaf-anim">
                        <rect x="766" y="112" width="312" height="478" rx="16" fill="#FF85D0" stroke="#1E2270" stroke-width="3" />
                    </g>
                </g>
                <!-- Outer Frame Border to keep left border crisp when door slides -->
                <rect x="766" y="112" width="312" height="478" rx="16" fill="none" stroke="#1E2270" stroke-width="3" />
                <!-- Left Hinges -->
                <rect x="757" y="142" width="18" height="58" rx="9" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <rect x="757" y="319" width="18" height="58" rx="9" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <rect x="757" y="497" width="18" height="58" rx="9" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <!-- Door Sign (Shifts left slightly on hover) -->
                <g class="door-sign-anim">
                    <rect x="823" y="184" width="202" height="73" rx="9" fill="#FFFFFF" stroke="#1E2270" stroke-width="3" />
                    <text x="924" y="230" text-anchor="middle" fill="#111111" font-size="29" font-weight="500" letter-spacing="2">公廁地圖</text>
                </g>
                <!-- Doorknob (Shifts left with door edge on hover) -->
                <g class="door-knob-anim">
                    <circle cx="1012" cy="360" r="27" fill="#1E2270" />
                    <rect x="996" y="380" width="12" height="24" fill="#1E2270" />
                    <rect x="1002" y="380" width="35" height="24" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                    <circle cx="1021" cy="360" r="26" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                    <circle cx="1021" cy="348" r="3" fill="#3CE6B0" />
                    <circle cx="1021" cy="362" r="3.5" fill="#1E2270" />
                </g>
            </g>

            <!-- 2. YELLOW MIRROR & DOUBLE SINK: 小怪圖鑑 -->
            <g id="openMonsterDexBtn" class="poogle-svg-btn" role="button" aria-label="小怪圖鑑">
                <title>點擊開啟「小怪圖鑑」</title>
                <!-- Yellow Mirror Base (extends down to y=957.5 to meet the pill sink's side tangents seamlessly) -->
                <path d="M532,620 L1060,620 Q1076,620 1076,636 L1076,957.5 L516,957.5 L516,636 Q516,620 532,620 Z" fill="#F2EC78" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <g clip-path="url(#mirrorReflectionClip)">
                    <g class="mirror-glare-anim">
                        <polygon points="732,620 822,620 715,955 625,955" fill="#FCF6E8" />
                        <polygon points="846,620 872,620 765,955 739,955" fill="#FCF6E8" />
                    </g>
                </g>
                <path d="M532,620 L1060,620 Q1076,620 1076,636 L1076,957.5 L516,957.5 L516,636 Q516,620 532,620 Z" fill="none" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <g transform="translate(636, 705) rotate(-12)">
                    <rect x="-89" y="-30" width="178" height="60" rx="8" fill="#FFFFFF" stroke="#1E2270" stroke-width="3" />
                    <text x="0" y="10" text-anchor="middle" fill="#111111" font-size="26" font-weight="500" letter-spacing="2">小怪圖鑑</text>
                </g>
                <!-- Double Sink Counter & Basins -->
                <rect x="516" y="891" width="560" height="133" rx="66.5" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <rect x="556" y="916" width="228" height="84" rx="42" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <rect x="810" y="916" width="228" height="84" rx="42" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <!-- Left Smooth Rounded Faucet -->
                <path d="M 657,852 L 657,849 A 16,16 0 0 1 689,849 L 689,891 A 16,16 0 0 1 657,891 L 657,876 L 615,876 A 12,12 0 0 1 615,852 Z"
                      fill="#FCF6E8" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <line x1="667" y1="878" x2="667" y2="891" stroke="#1E2270" stroke-width="4" stroke-linecap="round" />
                <!-- Right Smooth Rounded Faucet -->
                <path d="M 911,852 L 911,849 A 16,16 0 0 1 943,849 L 943,891 A 16,16 0 0 1 911,891 L 911,876 L 869,876 A 12,12 0 0 1 869,852 Z"
                      fill="#FCF6E8" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <line x1="921" y1="878" x2="921" y2="891" stroke="#1E2270" stroke-width="4" stroke-linecap="round" />
            </g>

            <!-- 3. MINT-GREEN PORTABLE TOILET: 公廁回報系統 -->
            <g id="openReportSystemBtn" class="poogle-svg-btn" role="link" aria-label="公廁回報系統">
                <title>點擊進入「公廁回報系統」並自動定位</title>
                <!-- Stationary Invisible Hit Area for Right Handle (Prevents hover jitter when handle shifts left) -->
                <rect x="1640" y="485" width="115" height="285" fill="transparent" stroke="none" />
                <!-- Left Cream Hinge Blocks (tucked cleanly inside the 3 left notches) -->
                <rect x="1116" y="311" width="38" height="123" rx="12" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <rect x="1116" y="573" width="38" height="123" rx="12" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <rect x="1116" y="835" width="38" height="123" rx="12" fill="#FCF6E8" stroke="#1E2270" stroke-width="3" />
                <!-- Dark Navy Door Frame Revealed Behind Green Door When Hovered -->
                <path d="M1122,252 C1212,200 1626,200 1698,252 L1698,1010 Q1698,1024 1685,1024 L1136,1024 Q1122,1024 1122,1010 L1122,966 Q1122,958 1130,958 L1141,958 Q1150,958 1150,947 L1150,846 Q1150,835 1141,835 L1130,835 Q1122,835 1122,827 L1122,704 Q1122,696 1130,696 L1141,696 Q1150,696 1150,685 L1150,584 Q1150,573 1141,573 L1130,573 Q1122,573 1122,565 L1122,442 Q1122,434 1130,434 L1141,434 Q1150,434 1150,423 L1150,322 Q1150,311 1141,311 L1130,311 Q1122,311 1122,303 Z"
                      fill="#23297A" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <!-- Clipped Green Door Body that slides left on hover to reveal dark navy door crack -->
                <g clip-path="url(#greenDoorFrameClip)">
                    <g class="report-leaf-anim">
                        <path d="M1122,252 C1212,200 1626,200 1698,252 L1698,1010 Q1698,1024 1685,1024 L1136,1024 Q1122,1024 1122,1010 L1122,966 Q1122,958 1130,958 L1141,958 Q1150,958 1150,947 L1150,846 Q1150,835 1141,835 L1130,835 Q1122,835 1122,827 L1122,704 Q1122,696 1130,696 L1141,696 Q1150,696 1150,685 L1150,584 Q1150,573 1141,573 L1130,573 Q1122,573 1122,565 L1122,442 Q1122,434 1130,434 L1141,434 Q1150,434 1150,423 L1150,322 Q1150,311 1141,311 L1130,311 Q1122,311 1122,303 Z"
                              fill="#3CE6B0" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                    </g>
                </g>
                <!-- Crisp Outer Frame Border -->
                <path d="M1122,252 C1212,200 1626,200 1698,252 L1698,1010 Q1698,1024 1685,1024 L1136,1024 Q1122,1024 1122,1010 L1122,966 Q1122,958 1130,958 L1141,958 Q1150,958 1150,947 L1150,846 Q1150,835 1141,835 L1130,835 Q1122,835 1122,827 L1122,704 Q1122,696 1130,696 L1141,696 Q1150,696 1150,685 L1150,584 Q1150,573 1141,573 L1130,573 Q1122,573 1122,565 L1122,442 Q1122,434 1130,434 L1141,434 Q1150,434 1150,423 L1150,322 Q1150,311 1141,311 L1130,311 Q1122,311 1122,303 Z"
                      fill="none" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <!-- Cream Roof Cap (Sits flush over the top of the green body with no gap) -->
                <path d="M1120,256 C1114,228 1146,205 1184,193 C1212,152 1312,138 1419,138 C1526,138 1626,152 1654,193 C1692,205 1724,228 1717,256 C1713,270 1700,274 1686,265 C1626,232 1526,222 1419,222 C1312,222 1212,232 1152,265 C1138,274 1125,270 1120,256 Z"
                      fill="#FCF6E8" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                <!-- Center White Oval Sign (Shifts left slightly on hover) -->
                <g class="report-sign-anim">
                    <ellipse cx="1419" cy="414" rx="146" ry="96" fill="#FFFFFF" stroke="#1E2270" stroke-width="3" />
                    <text x="1419" y="424" text-anchor="middle" fill="#111111" font-size="29" font-weight="500" letter-spacing="2">公廁回報系統</text>
                </g>
                <!-- Coral Red Lock Indicator (Turns green and shifts left with door on hover) -->
                <ellipse class="report-lock-anim" cx="1558" cy="628" rx="26" ry="16" fill="#F05662" stroke="#1E2270" stroke-width="3" />
                <!-- 3D Door Handle (Navy inner recess + Mint outer handle, shifts left with door edge) -->
                <g class="report-handle-anim">
                    <path d="M1652,492 C1586,506 1586,750 1652,764 L1663,732 C1626,715 1626,541 1663,524 Z"
                          fill="#1E2270" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                    <path d="M1652,492 C1750,506 1750,750 1652,764 L1652,724 C1705,707 1705,549 1652,532 Z"
                          fill="#3CE6B0" stroke="#1E2270" stroke-width="3" stroke-linejoin="round" />
                </g>
            </g>
        </svg>
    </main>

    <!-- Under Construction Popup Modal (For 小怪圖鑑 & 個人空間) -->
    <div id="underConstructionModal" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#FCF6E8] rounded-[28px] max-w-sm w-full border-2 border-[#1E2270] shadow-[0_8px_0_#1E2270] px-6 py-10 relative flex flex-col items-center justify-center text-center">
            <button id="closeUnderConstructionBtn" type="button" class="poogle-pill-btn absolute top-4 right-4 w-8 h-8 rounded-full bg-white text-black flex items-center justify-center focus:outline-none" aria-label="關閉">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="text-2xl sm:text-3xl font-extrabold text-black tracking-wider py-2">
                ⚠️施工中⚠️
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#FCF6E8] rounded-[32px] max-w-sm w-full border-2 border-[#1E2270] shadow-[0_10px_0_#1E2270] overflow-hidden">
            <div class="bg-[#72D0FF] border-b-2 border-[#1E2270] px-6 py-4 flex items-center justify-between">
                <h3 class="font-extrabold text-base text-black">有所味會員登入</h3>
                <button id="closeLoginModalBtn" type="button" class="poogle-pill-btn w-8 h-8 rounded-full bg-white text-black flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 space-y-4 text-center">
                <p id="loginModalStatusText" class="text-sm text-neutral-700 font-bold mb-3">登入以記錄您的專屬小怪與評鑑！</p>

                <!-- 登入後顯示的使用者資訊卡 -->
                <div id="loggedInUserCard" class="hidden p-4 rounded-2xl bg-white border-2 border-[#1E2270] flex items-center gap-3.5 text-left">
                    <div id="modalUserAvatarBox" class="w-12 h-12 rounded-full border-2 border-[#1E2270] overflow-hidden shrink-0"></div>
                    <div class="min-w-0 flex-1">
                        <div id="modalUserName" class="font-extrabold text-black text-sm truncate">使用者名稱</div>
                        <div id="modalUserEmail" class="text-xs text-neutral-500 truncate">user@gmail.com</div>

                        <line x1="25" y1="132" x2="-10" y2="200" /><line x1="50" y1="132" x2="25" y2="200" /><line x1="75" y1="132" x2="65" y2="200" /><line x1="100" y1="132" x2="100" y2="200" /><line x1="125" y1="132" x2="135" y2="200" /><line x1="150" y1="132" x2="175" y2="200" /><line x1="175" y1="132" x2="210" y2="200" />

        }

        window.addEventListener('DOMContentLoaded', () => {
            let pendingPersonalSpaceRedirect = false;
            let profileUnsubscribe = null;

            const loginText = document.getElementById('userLoginText');
            const avatarCircle = document.getElementById('userAvatarCircle');
            const googleBtn = document.getElementById('googleLoginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const statusText = document.getElementById('loginModalStatusText');
            const userCard = document.getElementById('loggedInUserCard');
            const modalAvatarBox = document.getElementById('modalUserAvatarBox');
            const modalName = document.getElementById('modalUserName');
            const modalEmail = document.getElementById('modalUserEmail');
            const errorBox = document.getElementById('loginErrorBox');
            const errorTitle = document.getElementById('loginErrorTitle');
            const errorDetail = document.getElementById('loginErrorDetail');
            const switchLocalhostBtn = document.getElementById('switchToLocalhostBtn');

            const renderUserPoogleAvatar = (avatarType) => {
                const chosen = avatarType || 'red_toilet';
                avatarCircle.className = 'w-11 h-11 sm:w-14 sm:h-14 rounded-full border-2 border-[#1E2270] overflow-hidden transition flex items-center justify-center shrink-0';
                avatarCircle.innerHTML = getPoogleAvatarSvg(chosen, 'nav');
                if (modalAvatarBox) {
                    modalAvatarBox.innerHTML = getPoogleAvatarSvg(chosen, 'modal');
                }
            };

            const syncAvatarFromStorageOrCloud = (userObj) => {
                if (!userObj || !userObj.uid) return;
                let chosenAvatar = userObj.avatarType || 'red_toilet';
                try {
                    chosenAvatar = localStorage.getItem(`poogle_avatar_${userObj.uid}`)
                        || localStorage.getItem('poogle_latest_avatar')
                        || userObj.avatarType
                        || 'red_toilet';
                } catch (e) {}

                loginText.textContent = userObj.displayName || '評鑑員';
                renderUserPoogleAvatar(chosenAvatar);

                modalName.textContent = userObj.displayName || '有所味評鑑員';
                modalEmail.textContent = userObj.email || '已透過 Google 驗證登入';
                statusText.textContent = '您目前已登入 Google 帳號：';
                userCard.classList.remove('hidden');
                errorBox.classList.add('hidden');
                googleBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');

                if (db) {
                    if (profileUnsubscribe) profileUnsubscribe();
                    profileUnsubscribe = db.collection('user_profiles').doc(userObj.uid).onSnapshot((doc) => {
                        if (doc.exists && doc.data()?.avatarType) {
                            const cloudAvatar = doc.data().avatarType;
                            try {
                                localStorage.setItem(`poogle_avatar_${userObj.uid}`, cloudAvatar);
                                localStorage.setItem('poogle_latest_avatar', cloudAvatar);
                            } catch (e) {}
                            renderUserPoogleAvatar(cloudAvatar);
                        }
                    }, () => {});
                }
            };

            // 預先從本機快取載入登入與頭貼狀態，並支援從個人空間返回時即時更新
            const checkCachedUserAndRefreshAvatar = () => {
                try {
                    const cachedUser = JSON.parse(localStorage.getItem('poogle_auth_user') || 'null');
                    if (cachedUser && cachedUser.uid) {
                        syncAvatarFromStorageOrCloud(cachedUser);
                    }
                } catch (e) {}
            };
            checkCachedUserAndRefreshAvatar();
            window.addEventListener('pageshow', checkCachedUserAndRefreshAvatar);
            window.addEventListener('focus', checkCachedUserAndRefreshAvatar);
            window.addEventListener('storage', checkCachedUserAndRefreshAvatar);

            // Firebase Auth 登入狀態監聽
            if (auth) {
                const showAuthDiagnosisError = (error) => {
                    errorBox.classList.remove('hidden');
                    switchLocalhostBtn.classList.add('hidden');
                    const code = error?.code || '';
                    const host = window.location.hostname || '本機檔案';

                    if (code === 'auth/unauthorized-domain' || host === '127.0.0.1') {
                        errorTitle.textContent = `網域未授權 (${host})`;
                        errorDetail.innerHTML = `Firebase 預設只允許 <code>localhost</code>，而您目前的 Live Server 網址為 <code>${escapeHtml(host)}</code>，因此視窗會自動秒關。<br><strong>解決方法 A：</strong>點擊下方按鈕改用 <code>localhost</code> 開啟即可登入！<br><strong>解決方法 B：</strong>至 Firebase 後台 ➔ Authentication ➔ Settings (設定) ➔ Authorized domains (已授權網域) 新增 <code>${escapeHtml(host)}</code>。`;
                        if (host === '127.0.0.1') {
                            switchLocalhostBtn.classList.remove('hidden');
                        }
                    } else if (code === 'auth/operation-not-allowed') {
                        errorTitle.textContent = '尚未在 Firebase 後台啟用 Google 登入';
                        errorDetail.innerHTML = '請前往 Firebase Console ➔ Authentication ➔ Sign-in method ➔ 點擊 <strong>Google</strong> 並開啟「啟用」開關與設定支援信箱後儲存。';
                    } else if (code === 'auth/operation-not-supported-in-this-environment' || window.location.protocol === 'file:') {
                        errorTitle.textContent = '請使用本地伺服器開啟網頁';
                        errorDetail.innerHTML = '直接雙擊開啟 HTML 檔案 (<code>file://</code>) 無法使用 Google 彈窗登入，請在 VS Code 按右鍵選擇 <strong>Open with Live Server</strong>。';
                    } else {
                        errorTitle.textContent = `登入未完成 (${code || '視窗關閉'})`;
                        errorDetail.textContent = error?.message || '請確認瀏覽器未封鎖彈出式視窗，且已在 Firebase Authentication 啟用 Google 登入。';
                    }
                };

                switchLocalhostBtn.addEventListener('click', () => {
                    const newUrl = window.location.href.replace('127.0.0.1', 'localhost');
                    window.location.href = newUrl;
                });

                // 處理從 Redirect 登入返回的情況
                auth.getRedirectResult().catch((err) => {
                    if (err && err.code) {
                        document.getElementById('loginModal').classList.remove('hidden');
                        showAuthDiagnosisError(err);
                    }
                });

                auth.onAuthStateChanged((user) => {
                    if (user) {
                        let chosenAvatar = 'red_toilet';
                        try {
                            chosenAvatar = localStorage.getItem(`poogle_avatar_${user.uid}`)
                                || localStorage.getItem('poogle_latest_avatar')
                                || 'red_toilet';
                        } catch (e) {}

                        const userObj = {
                            uid: user.uid,
                            displayName: user.displayName || '評鑑員',
                            email: user.email || '',
                            photoURL: user.photoURL || '',
                            avatarType: chosenAvatar
                        };
                        try {
                            localStorage.setItem('poogle_auth_user', JSON.stringify(userObj));
                        } catch (e) {}

                        syncAvatarFromStorageOrCloud(userObj);

                        if (pendingPersonalSpaceRedirect) {
                            pendingPersonalSpaceRedirect = false;
                            window.location.href = './profile.html';
                        }
                    } else {
                        let cachedUser = null;
                        try {
                            cachedUser = JSON.parse(localStorage.getItem('poogle_auth_user') || 'null');
                        } catch (e) {}
                        if (cachedUser && cachedUser.uid === 'preview_demo_user') {
                            syncAvatarFromStorageOrCloud(cachedUser);
                            return;
                        }
                        if (profileUnsubscribe) {
                            profileUnsubscribe();
                            profileUnsubscribe = null;
                        }
                        try { localStorage.removeItem('poogle_auth_user'); } catch (e) {}
                        loginText.textContent = '登入';
                        avatarCircle.className = 'w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-[#D6D6D6] group-hover:bg-[#72D0FF] border-2 border-transparent group-hover:border-[#1E2270] transition flex items-center justify-center text-base font-bold text-[#1E2270]';
                        avatarCircle.innerHTML = '';
                        avatarCircle.textContent = '';
                        statusText.textContent = '登入以記錄您的專屬小怪與評鑑！';
                        userCard.classList.add('hidden');
                        googleBtn.classList.remove('hidden');
                        logoutBtn.classList.add('hidden');
                    }
                });

                // 綁定 Google 登入按鈕
                googleBtn.addEventListener('click', async () => {
                    errorBox.classList.add('hidden');
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    try {
                        await auth.signInWithPopup(provider);
                        document.getElementById('loginModal').classList.add('hidden');
                    } catch (error) {
                        console.error('Google 登入失敗:', error);
                        showAuthDiagnosisError(error);
                    }
                });

                // 綁定登出按鈕
                logoutBtn.addEventListener('click', () => {
                    try {
                        localStorage.removeItem('poogle_auth_user');
                        localStorage.removeItem('poogle_latest_avatar');
                    } catch (e) {}
                    auth.signOut().then(() => {
                        document.getElementById('loginModal').classList.add('hidden');
                    });
                });
            }

            // 預載主頁四大區塊點擊音效 (./sfx/home_click.mp3)
            const homeClickAudio = new Audio('./sfx/home_click.mp3');
            homeClickAudio.preload = 'auto';

            const playHomeClickSfx = (navigateCallback) => {
                try {
                    homeClickAudio.currentTime = 0;
                    const playPromise = homeClickAudio.play();
                    if ( typeof navigateCallback === 'function' ) {
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => setTimeout(navigateCallback, 180))
                                .catch(() => navigateCallback());
                        } else {
                            setTimeout(navigateCallback, 180);
                        }
                    }
                } catch (e) {
                    if (typeof navigateCallback === 'function') navigateCallback();
                }
            };

            // 1. 公廁地圖：播放音效後跳轉至 map.html
            document.getElementById('enterMapDoorBtn').addEventListener('click', () => {
                playHomeClickSfx(() => {
                    window.location.href = './map.html';
                });
            });

            // 2. 公廁回報系統：播放音效並開啟定位方式彈窗
            const locateMethodModal = document.getElementById('locateMethodModal');
            document.getElementById('openReportSystemBtn').addEventListener('click', () => {
                playHomeClickSfx();
                locateMethodModal.classList.remove('hidden');
            });
            document.getElementById('closeLocateMethodBtn').addEventListener('click', () => {
                locateMethodModal.classList.add('hidden');
            });
            locateMethodModal.addEventListener('click', (e) => {
                if (e.target === locateMethodModal) locateMethodModal.classList.add('hidden');
            });

            document.getElementById('startNetworkLocateBtn').addEventListener('click', () => {
                window.location.href = './rating.html?mode=network';
            });

            // 3. 小怪圖鑑：播放音效並顯示「⚠️施工中⚠️」彈窗
            const underConstructionModal = document.getElementById('underConstructionModal');
            const openUnderConstruction = () => {
                playHomeClickSfx();
                underConstructionModal.classList.remove('hidden');
            };
            document.getElementById('openMonsterDexBtn').addEventListener('click', openUnderConstruction);
            document.getElementById('closeUnderConstructionBtn').addEventListener('click', () => {
                underConstructionModal.classList.add('hidden');
            });
            underConstructionModal.addEventListener('click', (e) => {
                if (e.target === underConstructionModal) underConstructionModal.classList.add('hidden');
            });

            // 4. 個人空間：播放音效，若已登入則跳轉 profile.html，未登入則彈出要求登入視窗
            document.getElementById('openPersonalSpaceBtn').addEventListener('click', () => {
                let cachedUser = null;
                try {
                    cachedUser = JSON.parse(localStorage.getItem('poogle_auth_user') || 'null');
                } catch (e) {}
                const currentUser = (auth && auth.currentUser) ? auth.currentUser : cachedUser;

                if (currentUser && currentUser.uid) {
                    playHomeClickSfx(() => {
                        window.location.href = './profile.html';
                    });
                } else {
                    playHomeClickSfx();
                    pendingPersonalSpaceRedirect = true;
                    const statusText = document.getElementById('loginModalStatusText');
                    if (statusText) {
                        statusText.textContent = '個人空間需要登入 Google 帳號才能使用，請先登入！';
                    }
                    document.getElementById('loginModal').classList.remove('hidden');
                }
            });

            document.getElementById('homeLoginBtn').addEventListener('click', () => {
                pendingPersonalSpaceRedirect = false;
                document.getElementById('loginModal').classList.remove('hidden');
            });
            document.getElementById('closeLoginModalBtn').addEventListener('click', () => {
                pendingPersonalSpaceRedirect = false;
                document.getElementById('loginModal').classList.add('hidden');
            });
        });
    </script>
</body>
</html>
